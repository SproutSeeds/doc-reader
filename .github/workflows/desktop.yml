name: Desktop installers
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to stage for release
        type: choice
        options: [all, windows]
        default: all
  push:
    tags: ['v*', '!v*-windows']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'windows' && '[{"os":"windows-latest","target":"Windows-x64"}]' || '[{"os":"macos-14","target":"macOS-Apple-Silicon"},{"os":"macos-15-intel","target":"macOS-Intel"},{"os":"windows-latest","target":"Windows-x64"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          enable-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build and verify bundled runtime
        run: python packaging/build_desktop.py --output build/desktop
        env:
          DOC_READER_CODESIGN_IDENTITY: '-'
          TMPDIR: ${{ runner.temp }}
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
      - name: Verify actual Kokoro and Whisper audio
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            "build/desktop/Read Docs/runtime/python.exe" packaging/smoke_speech.py
          else
            "build/desktop/Read Docs.app/Contents/Resources/runtime/bin/python3" packaging/smoke_speech.py
          fi
        env:
          HF_HOME: ${{ runner.temp }}/doc-reader-models
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Package macOS app for release signing
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "build/desktop/Read Docs.app" "Read-Docs-${{ matrix.target }}.zip"
      - name: Verify packaged Windows app window
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "build/desktop/Read Docs/runtime/python.exe" packaging/smoke_window.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DPayload=$pwd\build\desktop\Read Docs" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows installer on a clean profile
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/*Setup.exe | Select-Object -First 1
          $destination = "$env:RUNNER_TEMP\Read Docs Installed"
          $process = Start-Process $installer.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$destination`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          & "$destination\runtime\python.exe" packaging/smoke_desktop.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$destination\runtime\python.exe" packaging/smoke_launcher.py "$destination\DocReader.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $shell = New-Object -ComObject WScript.Shell
          $programs = [Environment]::GetFolderPath('Programs')
          $desktop = [Environment]::GetFolderPath('Desktop')
          $old = $shell.CreateShortcut("$programs\Doc Reader.lnk")
          $old.TargetPath = "$destination\DocReader.exe"
          $old.Save()
          $foreign = $shell.CreateShortcut("$desktop\Doc Reader.lnk")
          $foreign.TargetPath = "$env:WINDIR\System32\notepad.exe"
          $foreign.Save()
          $process = Start-Process $installer.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$destination`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Upgrade failed: $($process.ExitCode)" }
          if (Test-Path "$programs\Doc Reader.lnk") { throw 'Owned legacy shortcut was not migrated' }
          if (!(Test-Path "$desktop\Doc Reader.lnk")) { throw 'Unrelated desktop shortcut was removed' }
          $current = $shell.CreateShortcut("$programs\Read Docs.lnk")
          if ($current.TargetPath -ne "$destination\DocReader.exe") { throw 'Read Docs shortcut has the wrong target' }
          Write-Host 'PASS: clean install, upgrade, Read Docs shortcut and unrelated shortcut preservation'
      - uses: actions/upload-artifact@v4
        with:
          name: Read-Docs-${{ matrix.target }}
          path: |
            Read-Docs-*.zip
            dist/*Setup.exe
          if-no-files-found: error
          retention-days: 14
