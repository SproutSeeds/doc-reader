name: Desktop installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macOS-Apple-Silicon
          - os: macos-15-intel
            target: macOS-Intel
          - os: windows-latest
            target: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          enable-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build and verify bundled runtime
        run: python packaging/build_desktop.py --output build/desktop
        env:
          DOC_READER_CODESIGN_IDENTITY: '-'
          TMPDIR: ${{ runner.temp }}
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
      - name: Verify actual Kokoro and Whisper audio
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            "build/desktop/Doc Reader/runtime/python.exe" packaging/smoke_speech.py
          else
            "build/desktop/Doc Reader.app/Contents/Resources/runtime/bin/python3" packaging/smoke_speech.py
          fi
        env:
          HF_HOME: ${{ runner.temp }}/doc-reader-models
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Package macOS app for release signing
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "build/desktop/Doc Reader.app" "Doc-Reader-${{ matrix.target }}.zip"
      - name: Verify packaged Windows app window
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "build/desktop/Doc Reader/runtime/python.exe" packaging/smoke_window.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DPayload=$pwd\build\desktop\Doc Reader" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows installer on a clean profile
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/*Setup.exe | Select-Object -First 1
          $destination = "$env:RUNNER_TEMP\Doc Reader Installed"
          $process = Start-Process $installer.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$destination`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          & "$destination\runtime\python.exe" packaging/smoke_desktop.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Doc-Reader-${{ matrix.target }}
          path: |
            Doc-Reader-*.zip
            dist/*Setup.exe
          if-no-files-found: error
          retention-days: 14
