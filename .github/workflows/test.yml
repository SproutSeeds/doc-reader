name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt numpy
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Windows launcher without uv or py
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/windows-launcher-smoke.ps1
      - name: Build macOS application
        if: runner.os == 'macOS'
        env:
          DOC_READER_CODESIGN_IDENTITY: '-'
        run: ./build-macos-app "$RUNNER_TEMP/doc-reader-build"
      - name: Install FFmpeg for native capture test
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Test native macOS capture
        if: runner.os == 'macOS'
        run: bash tests/run-native-tests
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --check bin/read-docs.js
      - run: node --test tests/process-targets.test.js
      - run: npm pack --dry-run
